    }

      left: 0;
      right: 0;
      padding: 12px 24px;
      display: flex;
      gap: 1em;
      font-size: 15px;
      background: #fff;
    }

    nav a {
      color: #555;
      text-decoration: none;
    }

    nav a:hover {
      opacity: 0.5;
    }

    @media (max-width: 480px) {
      main {
        padding: 12vh 20px 8vh;
      }

      h1 {
        font-size: 24px;
      }

      h2 {
        font-size: 20px;
      }

      body {
        font-size: 17px;
      }
