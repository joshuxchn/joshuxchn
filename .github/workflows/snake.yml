name: Generate contribution snake

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/snake.yml"
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Generate snake SVGs
        uses: Platane/snk@v3
        with:
          github_user_name: joshuxchn
          outputs: |
            dist/github-snake.svg?color_snake=#8f6f56&color_dots=#eeeae2,#d8cbb8,#a7aa8c,#74806b,#4d5a4b
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#c2a47c&color_dots=#161b22,#4b5146,#626c59,#7b876e,#9aa184

      - name: Speed up snake animation
        run: sudo sed -i -E 's/[0-9]+ms/26000ms/g' dist/*.svg

      - name: Publish SVGs to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
