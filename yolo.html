  <style>
    @import url('https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;1,400&display=swap');

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'EB Garamond', Georgia, serif;
      font-size: 20px;
      line-height: 1.7;
      color: #1a1a1a;
      background: #fff;

      margin: 0;

      font-style: italic;
      color: #888;
      margin-bottom: 1.8em;
    }

    nav {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      padding: 12px 24px;
      display: flex;
      gap: 1em;
      font-size: 15px;
    }

    nav a {
      color: #555;
      text-decoration: none;
    }

    nav a:hover {
      opacity: 0.5;
    }

    .board {
      display: flex;
      flex-direction: column;
    }

    .board img {
      width: 100%;
      height: auto;
      display: block;
    }

    .board img.crop-top {
      object-fit: cover;
      object-position: center bottom;
    }

    @media (max-width: 480px) {
      h1 {
        font-size: 24px;
        padding: 12vh 20px 0.7em;
      }

      body {
        font-size: 17px;
      }
